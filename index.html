<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaIntel — Signal Dashboard</title>
<meta name="description" content="Real-time intelligence dashboard for markets, cybersecurity, AI, and geopolitics.">
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>
<a href="#dashboard-grid" class="skip-link">Skip to dashboard</a>

<header role="banner">
  <div class="logo-area">
    <h1>Alpha<span>Intel</span></h1>
    <a class="nav-link" href="landing.html">← Pricing</a>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search headlines, tickers, sources…" aria-label="Search">
    </div>
    <div class="filter-tabs" role="tablist" aria-label="Category filter">
      <button class="tab active" data-cat="all" role="tab" aria-selected="true">All</button>
      <button class="tab" data-cat="finance" role="tab" aria-selected="false">Markets</button>
      <button class="tab" data-cat="security" role="tab" aria-selected="false">Cyber</button>
      <button class="tab" data-cat="trends" role="tab" aria-selected="false">AI/Tech</button>
      <button class="tab" data-cat="geopower" role="tab" aria-selected="false">Geopower</button>
    </div>
  </div>
</header>

<main id="main" role="main">
  <section aria-labelledby="intel-heading">
    <h2 id="intel-heading" class="sr-only">Live Intelligence Feed</h2>
    <div class="intel-grid" id="dashboard-grid"></div>
    <div id="state-message" class="state-message" role="status" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="state-text">Loading intelligence…</p>
    </div>
  </section>
</main>

<footer class="foot">
  <span>&copy; <span id="year"></span> AlphaIntel. All rights reserved.</span>
  <span><a href="landing.html">Pricing</a> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></span>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
