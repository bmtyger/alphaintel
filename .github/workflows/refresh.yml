name: Refresh AlphaIntel dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run AlphaIntel updater
        run: python update_dashboard.py --max-items 150 || true

      - name: Upload refreshed data
        uses: actions/upload-artifact@v4
        with:
          name: alphaintel-data
          path: data.json
          retention-days: 7
