name: Refresh AlphaIntel Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run AlphaIntel updater
        run: |
          python update_dashboard.py --max-items 150

      - name: Show diagnostics
        run: |
          python - << 'PY'
          import json
          from pathlib import Path
          p = Path("data.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("last_updated=" + str(data.get("last_updated", "")))
          print("items=" + str(len(data.get("intel_stream", []))))
          from collections import Counter
          c = Counter(i.get("category") for i in data.get("intel_stream", []))
          print("categories=" + ", ".join(f"{k}:{v}" for k, v in sorted(c.items())))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
